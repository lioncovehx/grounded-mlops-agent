# The agent's identity: read-only in this namespace, plus patching Deployments for
# rollout restarts. No delete, no secrets, nothing outside the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent
subjects:
  - kind: ServiceAccount
    name: mlops-agent
roleRef:
  kind: Role
  name: mlops-agent
  apiGroup: rbac.authorization.k8s.io
