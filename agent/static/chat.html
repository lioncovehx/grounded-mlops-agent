<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grounded MLOps Agent</title>
<style>
  :root {
    --mist: #e9eef0; --panel: #ffffff; --ink: #14222b; --muted: #5b6b74; --line: #c9d3d8;
    --ok: #1f7a5c; --wait: #a86a12; --fail: #b03a48;
    --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
         background: var(--mist); color: var(--ink); font: 15px/1.55 var(--sans); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .brand b { color: var(--ok); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.up { background: var(--ok); } .dot.down { background: var(--fail); }
  header button { margin-left: auto; white-space: nowrap; }
  @media (max-width: 520px) { .brand { font-size: 10px; letter-spacing: .06em; } }
  main { overflow-y: auto; min-height: 0; padding: 24px 16px; }
  .log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  button { font: 500 13px var(--sans); border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

  .empty { color: var(--muted); padding: 40px 0; }
  .empty h1 { font: 600 22px/1.3 var(--sans); color: var(--ink); margin: 0 0 6px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

  .msg { border-radius: 10px; padding: 14px 16px; }
  .user { align-self: flex-end; max-width: 80%; background: var(--ink); color: var(--mist);
          white-space: pre-wrap; }
  .agent { background: var(--panel); border: 1px solid var(--line); }
  .agent.error { border-color: var(--fail); color: var(--fail); }
  .agent p, .agent ul, .agent ol, .agent pre, .agent table { margin: 0 0 10px; }
  .agent ul, .agent ol { padding-left: 22px; }
  .agent code { font: 13px var(--mono); background: var(--mist); padding: 1px 4px; border-radius: 3px; }
  .agent pre { background: var(--mist); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .agent pre code { background: none; padding: 0; }
  .agent table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .agent th, .agent td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .agent h2, .agent h3, .agent h4 { font: 600 15px/1.3 var(--sans); margin: 14px 0 6px; }

  /* The answer's three-part structure, marked by what each part means. */
  .agent h2.part { font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
                   padding-left: 9px; border-left: 3px solid var(--ink); margin: 16px 0 8px; }
  .agent h2.facts { border-color: var(--ok); color: var(--ok); }
  .agent h2.unknowns { border-color: var(--wait); color: var(--wait); }
  .agent > :first-child { margin-top: 0; }

  /* Evidence: one ticket per tool call. */
  .evidence { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .evidence > span { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
                     color: var(--muted); }
  .tickets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ticket { font: 12px var(--mono); border: 1px solid var(--line); border-left: 3px solid var(--ok);
            border-radius: 4px; background: var(--panel); }
  .ticket.error, .ticket.timeout, .ticket.unavailable { border-left-color: var(--fail); }
  .ticket.confirmation_required { border-left-color: var(--wait); }
  .ticket summary { padding: 3px 8px; cursor: pointer; list-style: none; }
  .ticket summary::-webkit-details-marker { display: none; }
  .ticket i { font-style: normal; color: var(--muted); }
  .ticket[open] { flex-basis: 100%; }
  .ticket pre { margin: 0; padding: 8px; max-height: 260px; overflow: auto; font-size: 12px;
                border-top: 1px solid var(--line); background: var(--mist); white-space: pre-wrap; }

  .pending { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--wait); border-radius: 6px;
             display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pending span { color: var(--wait); font-weight: 600; margin-right: auto; }
  .pending .go { background: var(--wait); border-color: var(--wait); color: #fff; }

  .thinking { color: var(--muted); font: 13px var(--mono); }
  .thinking::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px;
                      border-radius: 50%; background: var(--wait); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; } }

  form { display: flex; gap: 10px; max-width: 852px; width: 100%; margin: 0 auto; padding: 12px 16px 16px; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 11px 12px;
             font: 15px/1.4 var(--sans); color: var(--ink); background: var(--panel);
             border: 1px solid var(--line); border-radius: 8px; }
  form button { background: var(--ink); color: var(--mist); border-color: var(--ink); padding: 0 18px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="Agent status"></span>
  <span class="brand">Grounded MLOps Agent · <b id="project">…</b></span>
  <button type="button" id="reset">New chat</button>
</header>

<main id="scroll">
  <div class="log" id="log" aria-live="polite">
    <div class="empty" id="empty">
      <h1>Ask about your ML system.</h1>
      Answers come from live DVC, MLflow, Airflow and Kubernetes data. Each one lists the tool calls behind it.
      <div class="examples">
        <button type="button">Is the prediction API healthy?</button>
        <button type="button">Which run has the best F1, and what data was it trained on?</button>
        <button type="button">Why did the last training run fail?</button>
        <button type="button">Has production traffic drifted? Should we retrain?</button>
      </div>
    </div>
  </div>
</main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Ask about runs, data, pipelines or the deployment"
            aria-label="Message. Enter sends, Shift+Enter adds a line" maxlength="4000"></textarea>
  <button type="submit" id="send">Send</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
let history = [];  // earlier turns, sent with each question (last 10)
const remember = (role, content) => history.push({ role, content: content.slice(0, 8000) });

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inline = (s) => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

// Small Markdown subset: headings, lists, tables, code blocks, quotes, bold, inline code.
function markdown(text) {
  const lines = text.split("\n"), out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const code = [];
      while (++i < lines.length && !lines[i].startsWith("```")) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if (/^\s*\|/.test(line)) {
      const rows = [];
      for (; i < lines.length && /^\s*\|/.test(lines[i]); i++) {
        if (!/^\s*\|[\s:|-]+\|\s*$/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|"));
      }
      i--;
      out.push("<table>" + rows.map((r, n) => "<tr>" + r.map((c) =>
        n ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("") + "</tr>").join("") + "</table>");
    } else if (/^#{1,4}\s/.test(line)) {
      const title = line.replace(/^#+\s*/, ""), t = title.toLowerCase();
      const part = t.includes("known facts") ? " part facts" : t.includes("uncertaint") ? " part unknowns"
                 : t.includes("recommended") ? " part" : "";
      out.push(`<h2 class="${part.trim()}">${inline(title)}</h2>`);
    } else if (/^\s*([-*]|\d+\.)\s/.test(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i]); i++) {
        items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s/, ""))}</li>`);
      }
      i--;
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
    } else if (/^>\s?/.test(line)) {
      out.push(`<p><em>${inline(line.replace(/^>\s?/, ""))}</em></p>`);
    } else if (line.trim()) {
      out.push(`<p>${inline(line)}</p>`);
    }
  }
  return out.join("");
}

function add(cls, html) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  log.append(el);
  scrollDown();
  return el;
}

const scrollDown = () => ($("scroll").scrollTop = $("scroll").scrollHeight);

function evidenceHtml(evidence) {
  if (!evidence.length) return "";
  const total = evidence.reduce((s, e) => s + e.duration_ms, 0);
  const tickets = evidence.map((e) => {
    const detail = JSON.stringify(e.error ? { error: e.error, data: e.data } : e.data, null, 2);
    return `<details class="ticket ${esc(e.status)}"><summary>${esc(e.tool)} <i>${esc(e.status)} · ${e.duration_ms} ms</i></summary>`
         + `<pre>${esc(detail ?? "null")}</pre></details>`;
  }).join("");
  return `<div class="evidence"><span>Evidence · ${evidence.length} tool call${evidence.length > 1 ? "s" : ""} · ${(total / 1000).toFixed(1)} s</span>`
       + `<div class="tickets">${tickets}</div></div>`;
}

function showReply(res) {
  const el = add("agent", markdown(res.answer) + evidenceHtml(res.evidence || []));
  const pending = (res.evidence || []).find((e) => e.status === "confirmation_required");
  if (res.pending_action_id && pending) {
    const box = document.createElement("div");
    box.className = "pending";
    box.innerHTML = `<span>Waiting for your confirmation: ${esc(pending.tool)}</span>`
                  + `<button type="button" class="go">Confirm ${esc(pending.tool)}</button><button type="button">Cancel</button>`;
    const [go, cancel] = box.querySelectorAll("button");
    go.onclick = () => act(box, `/actions/${res.pending_action_id}/confirm`, true);
    cancel.onclick = () => act(box, `/actions/${res.pending_action_id}/cancel`, false);
    el.append(box);
    scrollDown();
  }
}

async function call(url, body) {
  const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                                  body: body ? JSON.stringify(body) : undefined });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(typeof data.detail === "string" ? data.detail : `HTTP ${resp.status}`);
  return data;
}

async function act(box, url, confirming) {
  box.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const res = await call(url);
    if (confirming) {
      box.querySelector("span").textContent = "Confirmed.";
      showReply(res);
      remember("assistant", res.answer);
    }
    else box.querySelector("span").textContent = "Cancelled. Nothing was changed.";
  } catch (err) {
    box.querySelector("span").textContent = `Not done: ${err.message}.`;
  }
}

async function ask(text) {
  add("user", esc(text));
  const waiting = add("agent thinking", "Checking the systems… 0 s");
  const started = Date.now();
  const timer = setInterval(() => {
    waiting.textContent = `Checking the systems… ${Math.round((Date.now() - started) / 1000)} s`;
  }, 1000);
  send.disabled = true;
  try {
    const res = await call("/chat", { message: text, history: history.slice(-10) });
    waiting.remove();
    showReply(res);
    remember("user", text); remember("assistant", res.answer);
  } catch (err) {
    waiting.remove();
    add("agent error", `The agent didn't answer: ${esc(err.message)}. Check that it's running, then try again.`);
  } finally {
    clearInterval(timer);
    send.disabled = false;
    input.focus();
  }
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  input.style.height = "";
  ask(text);
};
input.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
};
input.oninput = () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; };
document.querySelectorAll(".examples button").forEach((b) => (b.onclick = () => ask(b.textContent)));
$("reset").onclick = () => location.reload();

fetch("/health").then((r) => r.json()).then((h) => {
  $("project").textContent = h.project;
  $("dot").className = "dot up";
}).catch(() => { $("project").textContent = "offline"; $("dot").className = "dot down"; });
input.focus();
</script>
</body>
</html>
