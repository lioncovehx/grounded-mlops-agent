apiVersion: apps/v1
kind: Deployment
metadata:
  name: wine-quality-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wine-quality-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wine-quality-api
    spec:
      containers:
        - name: api
          image: wine-quality-api   # tag set in kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: wine-quality-api-config
          # Ready once the model is loaded; live while the process answers.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
